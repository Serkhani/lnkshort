[package]
name = "lnkshort"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
axum-prometheus = "0.10.1"
base64 = "0.23.1"
dotenvy = "0.15.7"
governor = "0.10.4"
hex = "0.4.3"
metrics = "0.24.6"
metrics-exporter-prometheus = "0.18.3"
rand = "0.10.3"
sea-orm = { version = "^1.1", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha3 = "0.12.0"
tokio = { version = "1.54.1", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["trace"] }
tower_governor = "0.8.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
